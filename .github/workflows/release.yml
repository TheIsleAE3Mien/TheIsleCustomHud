name: Build and release Windows installer

on:
  push:
    branches:
      - main
      - ae3mien
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    name: Windows x64
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prepare AE3Miền updater channel
        run: node -e "const fs=require('fs');const p=require('./package.json');p.build.publish[0].channel='ae3mien';fs.writeFileSync('package.json',JSON.stringify(p,null,2)+'\n')"

      - name: Check AE3Miền release tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $packageVersion = node -p "require('./package.json').version"
          $tagVersion = $env:RELEASE_TAG.TrimStart('v')

          if ($tagVersion -notmatch '^(?<base>\d+\.\d+\.\d+)-ae3mien\.\d+$') {
            throw "AE3Miền releases require a tag like v0.5.1-ae3mien.1"
          }
          if ($Matches.base -ne $packageVersion) {
            throw "AE3Miền tag base version $($Matches.base) does not match package.json version $packageVersion"
          }
          node -e "const fs=require('fs');const p=require('./package.json');p.version=process.argv[1];fs.writeFileSync('package.json',JSON.stringify(p,null,2)+'\n')" $tagVersion
          "RELEASE_NAME=TheIsleVNHud $tagVersion - Anh Em 3 Miền Only" >> $env:GITHUB_ENV

          $notes = "release-notes/$env:RELEASE_TAG.md"
          if (Test-Path -LiteralPath $notes) {
            Copy-Item -LiteralPath $notes -Destination release-body.md
          } else {
            "## TheIsleVNHud $tagVersion`n`nSee the generated changelog for this release." | Set-Content -LiteralPath release-body.md -Encoding utf8
          }

      - name: Type-check and build installer
        run: npm run dist -- --publish never

      - name: Upload installer artifact
        uses: actions/upload-artifact@v7
        with:
          name: TheIsleVNHud-Windows-x64
          path: |
            release/*.exe
            release/*.exe.blockmap
            release/ae3mien.yml
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ env.RELEASE_NAME }}
          body_path: release-body.md
          prerelease: true
          files: |
            release/*.exe
            release/*.exe.blockmap
            release/ae3mien.yml
